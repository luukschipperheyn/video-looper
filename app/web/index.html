<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video Looper</title>
<style>
	html, body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
		-webkit-user-drag: none; touch-action: pan-y; }
	body { margin: 0; padding: 24px 24px calc(104px + env(safe-area-inset-bottom)); background: #111; color: #eee;
		font: 18px -apple-system, sans-serif; }
	input[type=range], #trackpad, #pads button { touch-action: none; }
	#connection { font-weight: 600; }
	#export-state { font-weight: 600; }
	#export-state.running { color: #f44; }
	#export-reason { color: #fa0; }
	section { margin-top: 20px; }
	h2 { margin: 0 0 4px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
	label { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
	label > span { flex: 0 0 9em; }
	label > output { flex: 0 0 4em; text-align: right; font-variant-numeric: tabular-nums; }
	input[type=range] { flex: 1; height: 32px; }
	input[type=checkbox] { width: 32px; height: 32px; margin: 0; }
	select { font-size: 18px; padding: 4px 8px; }
	#pads { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; box-sizing: border-box; display: flex;
		gap: 8px; margin: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: #111; }
	#pads button { flex: 1; height: 72px; font-size: 18px; font-weight: 600; color: #eee; background: #333;
		border: 2px solid #555; border-radius: 12px; }
	#pads button.open { border-color: #f44; }
	#pads button.down { background: #a22; }
	#pads #panic { flex: 0 0 5.5em; background: #600; }
	#blend-names { display: flex; margin-left: calc(9em + 12px); margin-right: calc(4em + 12px); gap: 2px; }
	#blend-names span { flex: 1 1 0; text-align: center; font-size: 11px; line-height: 1.15; color: #888; }
	#blend-names span.on { color: #eee; }
	#live output { font-variant-numeric: tabular-nums; font-weight: 600; }
	#source-load { display: flex; align-items: center; gap: 12px; }
	#source-load button { font-size: 18px; padding: 12px 20px; color: #eee; background: #333; border: 2px solid #555;
		border-radius: 8px; }
	#source-reason { color: #fa0; }
	#folders { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
	#folders button { font-size: 18px; padding: 12px 20px; color: #eee; background: #333; border: 2px solid #555;
		border-radius: 8px; }
	#folders button.current { border-color: #4af; }
	#pager { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
	#pager[hidden] { display: none; }
	#pager button { font-size: 18px; padding: 12px 20px; color: #eee; background: #333; border: 2px solid #555;
		border-radius: 8px; }
	#pager button:disabled { opacity: 0.4; }
	#videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
	#videos button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; color: #eee;
		background: #222; border: 2px solid #444; border-radius: 8px; font-size: 14px; }
	#videos button.current { border-color: #4af; }
	#videos img { width: 160px; height: 100px; object-fit: contain; background: #000; }
	#videos span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#source-transform { margin-top: 8px; }
	#trackpad { height: 240px; background: #181818; border: 2px solid #555; border-radius: 12px; touch-action: none;
		position: relative; }
	#trackpad span { position: absolute; left: 16px; right: 16px; bottom: 16px; color: #888; font-size: 14px;
		pointer-events: none; }
	#transform-reset { margin-top: 12px; font-size: 18px; padding: 12px 20px; color: #eee; background: #333;
		border: 2px solid #555; border-radius: 8px; }
</style>
</head>
<body>
<p>Web interface: <span id="connection">connecting</span></p>
<p>Export: <span id="export-state">stopped</span> <span id="export-reason"></span></p>
<p id="live">Loop <output id="live-loop">0%</output> · Envelope <output id="live-envelope">0.00</output> ·
	Stage <output id="live-stage">idle</output> · Gate <output id="live-gate">closed</output> ·
	Cue <output id="live-cue">closed</output> · Video <output id="live-video">none</output></p>
<p id="source-load">
	<button id="source-prev">Previous</button>
	<button id="source-next">Next</button>
	<button id="source-webcam">Webcam</button>
	<span id="source-reason"></span>
</p>
<div id="folders"></div>
<div id="pager" hidden>
	<button type="button" id="page-prev">Previous page</button>
	<span id="page-label"></span>
	<button type="button" id="page-next">Next page</button>
</div>
<div id="videos"></div>
<div id="controls"></div>
<div id="pads">
	<button id="pad-gate">Overdub</button>
	<button id="pad-cue">Cue</button>
	<button id="panic">PANIC</button>
</div>
<script>
	const schema = /*CONTROL_SCHEMA*/null;
	const sections = [
		["Overdub", [
			["arm_record", "Latch"],
			["cue_active", "Cue"],
			["record_blend_mode", "Blend", ["Mix", "Add", "Multiply", "Screen", "Overlay", "Difference", "Lighten",
				"Darken", "Hard Light", "Soft Light", "Color Dodge", "Color Burn"]],
			["record_blend_opacity", "Opacity"],
			["gain_mix", "Blend gain"],
		]],
		["Envelope", [
			["env_enabled", "Envelope"],
			["env_attack", "Attack (s)"],
			["env_decay", "Decay (s)"],
			["env_sustain", "Sustain"],
			["env_release", "Release (s)"],
		]],
		["FX", [
			["fx_enabled", "FX"],
			["fx_commit", "Bake FX"],
			["fx_mode", "FX mode", ["Feedback", "Difference", "Chromatic", "Kaleido", "Blur"]],
			["fx_param1", "Param 1"],
			["fx_param2", "Param 2"],
			["fx_param3", "Param 3"],
		]],
		["Source", [
			["source_kind", "Source", ["Shader", "Video", "Black", "Webcam"]],
			["video_bars", "Black bars"],
			["video_aspect", "Preserve aspect"],
			["webcam_index", "Webcam"],
			["file_loop", "Video loop"],
			["file_paused", "Video paused"],
			["file_run_mode", "Video run mode", ["Free", "Trigger"]],
			["file_loop_start", "Loop start"],
			["file_loop_length", "Loop length"],
		]],
		["Tempo", [
			["bpm", "BPM"],
			["read_speed_mult", "Read speed"],
			["tempo_coupled", "Tempo coupled"],
		]],
		["Export", [
			["record_enabled", "Export"],
			["record_fps", "Export fps"],
		]],
	];

	document.addEventListener("gesturestart", (event) => event.preventDefault());
	document.addEventListener("contextmenu", (event) => {
		if (event.target.closest("img")) event.preventDefault();
	});

	const token = new URLSearchParams(location.search).get("token") || "";
	const connection = document.getElementById("connection");
	const exportState = document.getElementById("export-state");
	const exportReason = document.getElementById("export-reason");
	const controls = {};
	const state = {};
	const socket = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);

	const busy = (el) => el.dataset.down === "1" || (el.tagName === "SELECT" && document.activeElement === el);
	const format = (v) => String(Number(v.toFixed(3)));

	function show(name) {
		const control = controls[name];
		const { el, out, type } = control;
		if (!(name in state)) return;
		if (type === "bool") el.checked = state[name];
		else el.value = state[name];
		if (out) out.textContent = control.paint ? control.paint(state[name]) : format(state[name]);
	}

	function sendSet(name) {
		const control = controls[name];
		const { el, out, type } = control;
		const value = type === "bool" ? el.checked : type === "int" ? parseInt(el.value, 10) : parseFloat(el.value);
		if (out) out.textContent = control.paint ? control.paint(value) : format(value);
		if (name === "video_aspect" && value === true) xf.video_sy = xf.video_sx;
		if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ t: "set", name, value }));
	}

	function build(name, label, options) {
		const { type, min, max } = schema[name];
		const row = document.createElement("label");
		row.appendChild(document.createElement("span")).textContent = label;
		let el, out;
		if (type === "bool") {
			el = document.createElement("input");
			el.type = "checkbox";
		} else if (type === "int") {
			el = document.createElement("select");
			for (let i = min; i <= max; ++i) el.add(new Option(options ? options[i] : String(i), i));
		} else {
			el = document.createElement("input");
			el.type = "range";
			el.min = min;
			el.max = max;
			el.step = (max - min) / 1000;
			out = document.createElement("output");
		}
		row.appendChild(el);
		if (out) row.appendChild(out);
		controls[name] = { el, out, type };
		el.addEventListener("pointerdown", () => { el.dataset.down = "1"; });
		el.addEventListener("input", () => { if (type === "float") sendSet(name); });
		el.addEventListener("change", () => {
			if (type !== "float") sendSet(name);
			if (type === "int") el.blur();
		});
		return row;
	}

	const xf = { video_tx: 0, video_ty: 0, video_sx: 1, video_sy: 1, video_rot: 0 };
	const transformNames = ["video_tx", "video_ty", "video_sx", "video_sy", "video_rot"];
	let padDown = false;
	let transformSend = 0;

	function lim(name, value) {
		const c = schema[name];
		return Math.min(c.max, Math.max(c.min, value));
	}
	function sendTransform() {
		if (socket.readyState !== WebSocket.OPEN) return;
		for (const name of transformNames) socket.send(JSON.stringify({ t: "set", name, value: xf[name] }));
	}
	function queueTransform() {
		if (transformSend) return;
		transformSend = requestAnimationFrame(() => {
			transformSend = 0;
			sendTransform();
		});
	}
	function adoptTransform() {
		if (padDown) return;
		for (const name of transformNames) if (typeof state[name] === "number") xf[name] = state[name];
	}

	function buildTrackpad() {
		const wrap = document.createElement("div");
		wrap.id = "source-transform";
		const pad = wrap.appendChild(document.createElement("div"));
		pad.id = "trackpad";
		pad.appendChild(document.createElement("span")).textContent = "Drag to move. Pinch to move, scale, and rotate.";
		const reset = wrap.appendChild(document.createElement("button"));
		reset.type = "button";
		reset.id = "transform-reset";
		reset.textContent = "Reset";
		const pts = new Map();
		const shot = () => [...pts].map(([id, p]) => ({ id, x: p.x, y: p.y }));
		const spanScale = (oldSpan, newSpan) => {
			const floor = 16;
			if (oldSpan < floor && newSpan < floor) return 1;
			return newSpan / Math.max(oldSpan, floor);
		};
		const wrapAngle = (d) => {
			if (d > Math.PI) d -= Math.PI * 2;
			if (d < -Math.PI) d += Math.PI * 2;
			return d;
		};
		pad.addEventListener("contextmenu", (event) => event.preventDefault());
		pad.addEventListener("pointerdown", (event) => {
			pad.setPointerCapture(event.pointerId);
			pts.set(event.pointerId, { x: event.clientX, y: event.clientY });
			padDown = true;
		});
		pad.addEventListener("pointermove", (event) => {
			if (!pts.has(event.pointerId) || pad.clientWidth < 1 || pad.clientHeight < 1) return;
			const before = shot();
			const point = pts.get(event.pointerId);
			point.x = event.clientX;
			point.y = event.clientY;
			const after = shot();
			if (after.length === 1 && before.length === 1) {
				xf.video_tx = lim("video_tx", xf.video_tx + (after[0].x - before[0].x) / pad.clientWidth);
				xf.video_ty = lim("video_ty", xf.video_ty - (after[0].y - before[0].y) / pad.clientHeight);
				queueTransform();
				return;
			}
			if (after.length < 2 || before.length < 2) return;
			const oldA = before[0], oldB = before[1], newA = after[0], newB = after[1];
			const oldMidX = (oldA.x + oldB.x) / 2, oldMidY = (oldA.y + oldB.y) / 2;
			const newMidX = (newA.x + newB.x) / 2, newMidY = (newA.y + newB.y) / 2;
			xf.video_tx = lim("video_tx", xf.video_tx + (newMidX - oldMidX) / pad.clientWidth);
			xf.video_ty = lim("video_ty", xf.video_ty - (newMidY - oldMidY) / pad.clientHeight);
			const oldDx = Math.abs(oldB.x - oldA.x), oldDy = Math.abs(oldB.y - oldA.y);
			const newDx = Math.abs(newB.x - newA.x), newDy = Math.abs(newB.y - newA.y);
			const oldDist = Math.hypot(oldB.x - oldA.x, oldB.y - oldA.y);
			const newDist = Math.hypot(newB.x - newA.x, newB.y - newA.y);
			if (controls.video_aspect.el.checked) {
				if (oldDist > 1) {
					xf.video_sx = lim("video_sx", xf.video_sx * (newDist / oldDist));
					xf.video_sy = xf.video_sx;
				}
			} else {
				xf.video_sx = lim("video_sx", xf.video_sx * spanScale(oldDx, newDx));
				xf.video_sy = lim("video_sy", xf.video_sy * spanScale(oldDy, newDy));
			}
			const oldAng = Math.atan2(oldB.y - oldA.y, oldB.x - oldA.x);
			const newAng = Math.atan2(newB.y - newA.y, newB.x - newA.x);
			xf.video_rot = lim("video_rot", xf.video_rot - wrapAngle(newAng - oldAng));
			queueTransform();
		});
		const lift = (event) => {
			pts.delete(event.pointerId);
			if (pts.size === 0) padDown = false;
		};
		pad.addEventListener("pointerup", lift);
		pad.addEventListener("pointercancel", lift);
		reset.addEventListener("click", () => {
			xf.video_tx = 0;
			xf.video_ty = 0;
			xf.video_sx = 1;
			xf.video_sy = 1;
			xf.video_rot = 0;
			sendTransform();
		});
		return wrap;
	}

	function buildBlend(label, names) {
		const wrap = document.createElement("div");
		wrap.id = "blend";
		const row = wrap.appendChild(document.createElement("label"));
		row.appendChild(document.createElement("span")).textContent = label;
		const el = row.appendChild(document.createElement("input"));
		el.type = "range";
		el.min = "0";
		el.max = String(names.length - 1);
		el.step = "1";
		const out = row.appendChild(document.createElement("output"));
		const ticks = wrap.appendChild(document.createElement("div"));
		ticks.id = "blend-names";
		for (const name of names) ticks.appendChild(document.createElement("span")).textContent = name;
		const paint = (value) => {
			const i = Math.max(0, Math.min(names.length - 1, parseInt(value, 10) || 0));
			for (let n = 0; n < ticks.children.length; ++n) ticks.children[n].classList.toggle("on", n === i);
			return names[i];
		};
		controls.record_blend_mode = { el, out, type: "int", paint };
		el.addEventListener("pointerdown", () => { el.dataset.down = "1"; });
		el.addEventListener("input", () => sendSet("record_blend_mode"));
		return wrap;
	}

	const root = document.getElementById("controls");
	for (const [title, rows] of sections) {
		const section = root.appendChild(document.createElement("section"));
		section.appendChild(document.createElement("h2")).textContent = title;
		for (const [name, label, options] of rows)
			section.appendChild(name === "record_blend_mode" ? buildBlend(label, options) : build(name, label, options));
		if (title === "Source") section.appendChild(buildTrackpad());
	}

	function release() {
		for (const name in controls) {
			const { el, type } = controls[name];
			if (el.dataset.down !== "1") continue;
			delete el.dataset.down;
			if (type !== "int") show(name);
		}
	}
	window.addEventListener("pointerup", release);
	window.addEventListener("pointercancel", release);

	const pads = {};
	// Returns whether the pad was down.
	function stopPad(name) {
		const pad = pads[name];
		if (!pad.timer) return false;
		clearInterval(pad.timer);
		pad.timer = 0;
		pad.el.classList.remove("down");
		return true;
	}
	for (const name of ["gate", "cue"]) {
		const el = document.getElementById(`pad-${name}`);
		pads[name] = { el, timer: 0 };
		el.addEventListener("pointerdown", (event) => {
			if (connection.textContent !== "connected" || pads[name].timer) return;
			el.setPointerCapture(event.pointerId);
			const hold = () => socket.send(JSON.stringify({ t: "hold", name }));
			hold();
			pads[name].timer = setInterval(hold, 100);
			el.classList.add("down");
		});
		const up = () => {
			if (stopPad(name) && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ t: "release", name }));
		};
		el.addEventListener("pointerup", up);
		el.addEventListener("pointercancel", up);
	}
	document.getElementById("panic").addEventListener("click", () => {
		if (socket.readyState !== WebSocket.OPEN) return;
		socket.send(JSON.stringify({ t: "panic" }));
		for (const name in pads) stopPad(name);
	});

	const sourceReason = document.getElementById("source-reason");
	for (const t of ["prev", "next", "webcam"]) {
		document.getElementById(`source-${t}`).addEventListener("click", () => {
			if (socket.readyState !== WebSocket.OPEN) return;
			sourceReason.textContent = "";
			socket.send(JSON.stringify({ t }));
		});
	}

	const videosGrid = document.getElementById("videos");
	const pageSize = 12;
	const pager = document.getElementById("pager");
	let shownVideos = "";
	let videoNames = [];
	let page = 0;
	let followedVideo;
	function renderVideos() {
		const pages = Math.max(1, Math.ceil(videoNames.length / pageSize));
		if (page >= pages) page = pages - 1;
		if (page < 0) page = 0;
		const start = page * pageSize;
		const slice = videoNames.slice(start, start + pageSize);
		videosGrid.replaceChildren();
		for (const name of slice) {
			const button = videosGrid.appendChild(document.createElement("button"));
			button.dataset.name = name;
			const img = button.appendChild(document.createElement("img"));
			const src = `/thumb?name=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`;
			let tries = 0;
			// Thumbnails are made after the folder scan, so one may not exist yet when the grid appears.
			img.onerror = () => {
				if (++tries <= 30) setTimeout(() => { img.src = `${src}&try=${tries}`; }, 1000);
			};
			img.src = src;
			img.alt = "";
			button.appendChild(document.createElement("span")).textContent = name;
			button.addEventListener("click", () => {
				if (socket.readyState !== WebSocket.OPEN) return;
				sourceReason.textContent = "";
				socket.send(JSON.stringify({ t: "load", name }));
			});
		}
		for (const button of videosGrid.children) button.classList.toggle("current", button.dataset.name === state.video);
		pager.hidden = videoNames.length <= pageSize;
		document.getElementById("page-prev").disabled = page === 0;
		document.getElementById("page-next").disabled = page + 1 >= pages;
		const end = Math.min(start + pageSize, videoNames.length);
		document.getElementById("page-label").textContent = videoNames.length ? `${start + 1}–${end} of ${videoNames.length}` : "";
	}
	function showVideos(names) {
		const key = JSON.stringify(names);
		if (key === shownVideos) return;
		shownVideos = key;
		videoNames = names.slice();
		page = 0;
		renderVideos();
	}
	document.getElementById("page-prev").addEventListener("click", () => {
		if (page <= 0) return;
		page -= 1;
		renderVideos();
	});
	document.getElementById("page-next").addEventListener("click", () => {
		page += 1;
		renderVideos();
	});

	const foldersRow = document.getElementById("folders");
	let shownFolders = "";
	function showFolders(paths) {
		const key = JSON.stringify(paths);
		if (key === shownFolders) return;
		shownFolders = key;
		foldersRow.replaceChildren();
		for (const path of paths) {
			const button = foldersRow.appendChild(document.createElement("button"));
			button.dataset.path = path;
			button.textContent = path.replace(/\/+$/, "").split("/").pop() || path;
			button.addEventListener("click", () => {
				if (socket.readyState !== WebSocket.OPEN) return;
				sourceReason.textContent = "";
				socket.send(JSON.stringify({ t: "folder", name: path }));
			});
		}
	}

	const stages = ["idle", "attack", "decay", "sustain", "release"];
	const live = (id, text) => { document.getElementById(`live-${id}`).textContent = text; };

	socket.onopen = () => { connection.textContent = "connected"; };
	socket.onclose = () => {
		connection.textContent = "disconnected";
		for (const name in pads) stopPad(name);
	};
	socket.onmessage = (event) => {
		const msg = JSON.parse(event.data);
		if (msg.t === "snapshot") {
			Object.assign(state, msg);
			for (const name in controls) if (!busy(controls[name].el)) show(name);
			adoptTransform();
			live("loop", `${Math.round(state.loop * 100)}%`);
			live("envelope", state.envelope.toFixed(2));
			live("stage", stages[state.stage] || String(state.stage));
			live("gate", state.gate ? "open" : "closed");
			live("cue", state.cue ? "open" : "closed");
			live("video", state.video || "none");
			if ("source_error" in state) {
				if (state.source_error) {
					sourceReason.dataset.kind = "source";
					sourceReason.textContent = state.source_error;
				} else if (sourceReason.dataset.kind === "source") {
					sourceReason.textContent = "";
					delete sourceReason.dataset.kind;
				}
			}
			if ("folders" in msg) showFolders(msg.folders);
			for (const button of foldersRow.children)
				button.classList.toggle("current", button.dataset.path === state.videos_folder);
			if ("videos" in msg) showVideos(msg.videos);
			if (state.video !== followedVideo) {
				followedVideo = state.video;
				const at = videoNames.indexOf(state.video);
				if (at >= 0) {
					const next = Math.floor(at / pageSize);
					if (next !== page) {
						page = next;
						renderVideos();
					}
				}
			}
			for (const button of videosGrid.children) button.classList.toggle("current", button.dataset.name === state.video);
			pads.gate.el.classList.toggle("open", state.gate);
			pads.cue.el.classList.toggle("open", state.cue);
			exportState.textContent = state.record_enabled ? "running" : "stopped";
			exportState.className = state.record_enabled ? "running" : "";
			if (state.record_enabled) exportReason.textContent = "";
		} else if (msg.t === "reject") {
			if (controls[msg.name]) show(msg.name);
			if (msg.name === "record_enabled") exportReason.textContent = msg.reason;
			if (msg.name === "source") {
				sourceReason.dataset.kind = "source";
				sourceReason.textContent = msg.reason;
				show("source_kind");
			}
			if (msg.name === "folder") {
				sourceReason.dataset.kind = "folder";
				sourceReason.textContent = msg.reason;
			}
		}
	};
</script>
</body>
</html>
