<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video Looper</title>
<style>
:root{--loop:16/9;--bg:#0d0f10;--panel:#15181a;--panel2:#1c2023;--line:#252a2e;--line2:#333a3f;--text:#e7e9eb;--dim:#8b9297;--faint:#5c646a;
	--rec:#ff5b4f;--cue:#45d3c8;--amber:#f3a93c;--amberd:#33250f;--ok:#93d46d;
	--fl:#f2c46b;--fd:#6b8cf2;--fc:#c77df2;--fx:#6bf2a8;--fn:#9aa3a9}
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;height:100%;background:#050606;color:var(--text);overflow:hidden;touch-action:none;
	font:14px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;
	-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{opacity:.35}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#viewport{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);
	display:flex;align-items:center;justify-content:center;overflow:hidden}
#holder{position:relative}
#two-hands{position:absolute;left:0;top:0;width:1366px;height:950px;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:16px;
	display:grid;grid-template-rows:44px 1fr;--ovl-left:206px;--ovl-right:540px}
#two-hands .drawer{grid-template-columns:1fr}
#two-hands main{position:relative;display:grid;grid-template-columns:196px 1fr 520px;gap:10px;padding:10px;min-height:0}
#two-hands .pcol{display:grid;grid-template-rows:3fr 76px 2fr 76px 92px;gap:8px;min-height:0}
#two-hands .odub{display:flex;flex-direction:column;gap:8px;min-height:0;height:100%}
#two-hands .odub>.pad.rec{flex:1;min-height:0}
#two-hands .rcol{display:grid;grid-template-rows:minmax(0,1fr) 490px;gap:10px}
#two-hands .rcol>.panel{min-height:0}
#two-hands .rcol>.xf{height:100%;overflow:hidden}
#two-hands .rcol>.fx{overflow:auto}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:8px;min-height:24px}
.pt{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.pv{font-size:13px;font-weight:600}
.hint{font-size:11px;color:var(--faint)}
.clip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.row{display:flex;align-items:center;gap:6px}
.btn{height:40px;padding:0 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{background:#2a3034}
.btn.sq{width:40px;padding:0;font-size:18px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;min-width:0}
.seg button{flex:1;height:34px;border-radius:6px;font-size:13px;color:var(--dim);padding:0 8px;white-space:nowrap}
.seg.modes{flex-wrap:wrap}
.seg.modes button{flex:1 1 30%;height:32px;font-size:12px;padding:0 4px}
.fx .seg.modes{flex-wrap:nowrap}
.fx .seg.modes button{flex:1 1 0;height:30px;font-size:11px;padding:0 2px}
.fx .bb{height:34px;font-size:11px}
.seg.chain{flex:none;width:210px}
.fxedit{display:flex;flex-direction:column;gap:8px;min-height:0}
.seg button.on{background:var(--text);color:#111;font-weight:650}
.seg.tapseg{flex:none}
.seg.tapseg button{flex:none;padding:0 12px}
.vgrid.dub .vc .th{border-color:#6b2a25}
.vgrid.dub .vc.cur .th{border-color:var(--rec)}
.tog{height:34px;padding:0 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.tog .led{width:8px;height:8px;border-radius:50%;background:#3a4045;flex:none}
.tog .st{color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tog.on{border-color:#4d6a3e}
.tog.on .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tog.on .st{color:var(--ok)}
.tog.amber.on{border-color:var(--amber);background:var(--amberd)}
.tog.amber.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tog.amber.on .st{color:var(--amber)}
.dimmed>*:not(.ph){opacity:.45}
.fader{display:flex;flex-direction:column;gap:5px;min-width:0;min-height:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--dim)}
.fv{color:var(--text);font-variant-numeric:tabular-nums;font-weight:650}
.ft{position:relative;height:40px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);overflow:hidden;touch-action:none;flex:none}
.ff{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#26302a,#93d46d40);border-right:2px solid var(--ok)}
.fader.bip .ff{border-right:0;background:#93d46d40}
.fader.bip .ft::after{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:#ffffff30}
.ticks{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#ffffff14 calc(10% - 1px) 10%)}
.fader.off{opacity:.35;pointer-events:none}
.fader.v{height:100%}
.fader.v .fh{flex-direction:column;align-items:center;gap:2px}
.fader.v .ft{flex:1;height:auto}
.fader.v .ff{top:auto;right:0;bottom:0;width:auto;border-right:0;border-top:2px solid var(--ok);background:linear-gradient(0deg,#26302a,#93d46d40)}
.fader.v .ticks{background:repeating-linear-gradient(0deg,transparent 0 calc(10% - 1px),#ffffff14 calc(10% - 1px) 10%)}
.fader.big .fv{font-size:20px}
.fader.big .fh{font-size:13px}
.fader.dense .ft{height:32px}
.fader.dense .fh{font-size:11px}
.status{display:flex;align-items:center;gap:14px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:#101314;font-size:12px;min-width:0}
.conn{display:flex;align-items:center;gap:6px;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.lost{color:var(--amber)} .conn.lost .dot{background:var(--amber)}
.meter{display:flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
.bar{position:relative;height:8px;border-radius:4px;background:#22272b;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.lbar{width:180px} .lbar i{background:#45d3c840;border-right:2px solid var(--cue)}
.ebar{width:60px} .ebar i{background:var(--rec)}
.est{width:50px;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:4px}
.chip{height:22px;padding:0 7px;white-space:nowrap;border-radius:5px;font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;border:1px solid var(--line2);color:var(--faint)}
.chip.on.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.chip.on.cue{background:var(--cue);border-color:var(--cue);color:#032}
.chip.on.fx{background:#2c3a26;border-color:#4d6a3e;color:var(--ok)}
.chip.on.bake{background:var(--amber);border-color:var(--amber);color:#211}
.nowv{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.nowv b{color:var(--cue);font-weight:600}
.status .btn{height:32px;font-size:12px;padding:0 10px}
.exp.on{border-color:var(--rec);color:#ffb3ad;background:#2b1210}
.exp .rd{width:8px;height:8px;border-radius:50%;background:#5a2a26}
.exp.on .rd{background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.export-reason{color:var(--amber);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad{position:relative;border-radius:12px;border:2px solid;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;touch-action:none;min-height:0}
.pad .fill{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none}
.pad .top{display:flex;justify-content:space-between;align-items:baseline;position:relative}
.pad .nm{font-size:22px;font-weight:650}
.pad .stg{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pad .sb{position:relative;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.pad.rec{border-color:#6b2a25;background:#1b1211}
.pad.rec .fill{background:linear-gradient(0deg,#ff5b4f70,#ff5b4f20)}
.pad.rec.open{border-color:var(--rec);background:#341411}
.pad.rec.open .sb,.pad.rec .stg{color:#ffd2ce}
.pad.cue{border-color:#1f5450;background:#0f1a19}
.pad.cue.open{border-color:var(--cue);background:#123a37}
.pad.cue.open .sb{color:#d2fffb}
.pad.erase{flex:0 0 84px;border-color:#8b939c;background:#171b1f;color:#e8eef4}
.pad.erase .sb{color:#b7c0c8}
.pad.erase .fill{background:linear-gradient(0deg,#ffffff66,#ffffff18)}
.pad.erase.open{border-color:#fff;background:#2a3138}
.pad.erase.open .sb,.pad.erase .stg{color:#fff}
.ptog{position:relative;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;min-height:0}
.ptog .led{width:12px;height:12px;border-radius:50%;background:#3a4045}
.ptog .pn{font-size:13px;font-weight:650;text-align:center}
.ptog .ps{font-size:10px;font-weight:750;letter-spacing:.07em;color:var(--faint);text-align:center;text-transform:uppercase}
.ptog.rec.on{border-color:var(--rec);background:#341411} .ptog.rec.on .led{background:var(--rec);box-shadow:0 0 8px var(--rec)} .ptog.rec.on .ps{color:#ffd2ce}
.ptog.cue.on{border-color:var(--cue);background:#123a37} .ptog.cue.on .led{background:var(--cue);box-shadow:0 0 8px var(--cue)} .ptog.cue.on .ps{color:#d2fffb}
.panic{border:2px solid #7a2a24;color:#ff8a80;border-radius:12px;background:#140c0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
.panic div:first-child{font-weight:800;letter-spacing:.14em;font-size:14px}
.panic .psub{font-size:10px;color:#b0625b;text-align:center;padding:0 4px}
.panic:active{background:#3a1512}
.unknown{border-color:#5a4a2a!important;background:var(--panel2)!important}
.unknown::after{content:'status onbekend';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
	background:repeating-linear-gradient(45deg,#000d 0 8px,#000a 8px 16px);color:var(--amber);font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;z-index:3}
.videos{flex:1;min-height:0}
.folders{display:flex;gap:4px;min-width:0;overflow:hidden}
.fchip{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fchip.on{border-color:var(--cue);color:var(--text)}
.vgrid{position:relative;flex:1;min-height:0;display:grid;gap:6px;align-content:start;touch-action:none;grid-template-columns:repeat(5,1fr)}
.vc{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.vc .th{position:relative;aspect-ratio:var(--loop);border-radius:6px;overflow:hidden;background:#000;border:2px solid transparent;transition:transform .08s}
.vc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.vc .nm{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:13px}
.vc.cur .th{border-color:var(--cue)}
.vc.cur .nm{color:var(--cue);font-weight:600}
.vc.press .th{transform:scale(.94)}
.vgrid.inactive .vc{opacity:.4}
.vempty{grid-column:1/-1;padding:20px;color:var(--faint);font-size:12px;text-align:center}
.vover{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#0d0f10ee;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px;color:var(--dim);z-index:2;text-align:center;max-width:90%}
.vover b{color:var(--text)}
.vfoot{display:flex;align-items:center;gap:6px}
.seg.kindseg{flex:1;min-width:0}
.seg.kindseg button{padding:0 5px;font-size:12px}
.draw{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dtools .seg{flex:none}
.dtools .seg button{flex:none;padding:0 10px;font-size:12px;height:32px}
.dtools .btn{height:34px;font-size:12px}
.swatches{display:flex;gap:4px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px #ffffff40}
.swatch.on{border-color:#fff}
.dstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;border:1px solid var(--line2);
	background:repeating-conic-gradient(#0000 0% 25%,#ffffff14 0% 50%) 50%/18px 18px,#0b0d0e}
.draw.black .dstage{background:#000}
.dstage canvas{width:100%;height:auto;max-height:100%;touch-action:none;display:block}
.plabel{font-size:12px;color:var(--dim);min-width:84px;text-align:center}
.xf{flex:1}
.tpad{position:relative;flex:1;min-height:0;border-radius:8px;background-color:#0b0d0e;border:1px solid var(--line2);overflow:hidden;touch-action:none;cursor:grab;
	background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:32px 32px;background-position:center}
.tpad.touch{border-color:#2d6f6a;cursor:grabbing}
.tpad.scale{cursor:ns-resize}
.tpad.rot{cursor:ew-resize}
.lframe{position:absolute;overflow:hidden;box-shadow:0 0 0 1px #ffffff70}
.lframe.bars{background:#000}
.lframe .simg{position:absolute;transform-origin:50% 50%}
.lframe .simg img{display:block;width:100%;height:100%;opacity:.8;pointer-events:none;-webkit-user-drag:none}
.lframe.fillsrc .simg{inset:0!important;width:auto!important;height:auto!important;transform:none!important;background:repeating-linear-gradient(135deg,#2b3134 0 6px,#202528 6px 12px)}
.sout{position:absolute;border:1.5px solid var(--cue);transform-origin:50% 50%;pointer-events:none}
.sout span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.24em;color:var(--cue);text-shadow:0 0 4px #000}
.flabel{position:absolute;left:6px;top:4px;font-size:9px;letter-spacing:.18em;color:#ffffffa0;text-shadow:0 0 3px #000;z-index:1}
.xhair{position:absolute;pointer-events:none;background:#ffffff18}
.xfread{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim)}
.xfread b{color:var(--text);font-weight:650;margin-left:4px}
.xfread .btn{height:36px}
.tpnote{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--faint);pointer-events:none}
.bgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;touch-action:none}
.bb{height:40px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;position:relative;overflow:hidden;white-space:nowrap;padding:0 4px}
.bb::before{content:'';position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--fam)}
.bb.on{background:var(--text);color:#111;font-weight:700}
.fams{display:flex;gap:8px;font-size:10px;color:var(--faint)}
.fams i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}
.lr{position:relative;height:44px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);touch-action:none;flex:none;
	background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#ffffff12 calc(10% - 1px) 10%)}
.lr .win{position:absolute;top:-1px;bottom:-1px;background:#45d3c82a;border-top:2px solid var(--cue);border-bottom:2px solid var(--cue);touch-action:none}
.lr .hd{position:absolute;top:-1px;bottom:-1px;width:14px;background:var(--cue);border-radius:4px;touch-action:none}
.lr .hd::before{content:'';position:absolute;top:-6px;bottom:-6px;left:-14px;right:-14px}
.lr .hd::after{content:'';position:absolute;left:5px;right:5px;top:14px;bottom:14px;border-left:1px solid #0337;border-right:1px solid #0337}
.lr .hd.s{left:-7px} .lr .hd.e{right:-7px}
.adsr{flex:1}
.envbox{position:relative;flex:1;min-height:90px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);touch-action:none;overflow:hidden}
.envbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ea{fill:#93d46d18}
.el{fill:none;stroke:var(--ok);stroke-width:2}
.eg{stroke:#ffffff10;stroke-width:1}
.ed{fill:var(--rec);stroke:#fff;stroke-width:1.5}
.eh .hit{fill:transparent}
.eh .vis{fill:#0f1214;stroke:var(--ok);stroke-width:2}
.eh text{fill:var(--dim);font-size:10px;font-weight:700}
.adsr.envoff .envbox{opacity:.35}
.envvals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--dim)}
.envvals b{color:var(--text);font-weight:650;margin-left:3px}
.bpm{height:40px;min-width:78px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:7px;touch-action:none}
.bpm .bv{font-size:20px;font-weight:700}
.bpm .u{font-size:10px;color:var(--dim)}
.overlay{position:absolute;z-index:20;top:10px;bottom:10px;right:var(--ovl-right,10px);left:var(--ovl-left,10px);background:#0d0f10f4;border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px #000a;overflow:hidden}
.ogrid{display:grid;grid-template-columns:1fr;gap:10px;align-content:start;overflow:hidden}
.osec{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.osec p{margin:0;font-size:12px;color:var(--dim);line-height:1.4}
.drawer{display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1;min-height:0}
.drawer .panel{flex:none;min-height:min-content}
.drawer .panel.adsr{height:300px}
.blendpick{display:flex;flex-direction:column;gap:4px}
#mid-error{color:var(--amber);padding:0 4px}
</style>
</head>

<script>
const schema = /*CONTROL_SCHEMA*/null;
const dragValue = gestures.relativeDrag;
const token = new URLSearchParams(location.search).get("token") || "";
const FX_MODES = ["Feedback", "Diff", "Chroma", "Kaleido", "Blur", "Repeat", "Grid"];
const FX_LABELS = [
	["Mix", "Decay", "Zoom"],
	["ongebruikt", "Schaal", "Decay"],
	["Chroma", "Decay", "Zoom"],
	["Segmenten", "Decay", "Zoom"],
	["Radius", "Decay", "Zoom"],
	["Afstand", "Hoek", "Aantal"],
	["Afstand", "Hoek", "Aantal"],
];
const REPEAT_MODE = 5;
const GRID_MODE = 6;
const GRID_MAX = 6;
const STAGES = ["idle", "attack", "decay", "sustain", "release"];
const FAM = { none: "fn", light: "fl", dark: "fd", contrast: "fc", difference: "fx" };
const transformNames = ["video_tx", "video_ty", "video_sx", "video_sy", "video_rot"];
const NS = "http://www.w3.org/2000/svg";

function storedTap() {
	try { return localStorage.getItem("vl-tap") === "dub" ? "dub" : "select"; }
	catch (err) { return "select"; }
}

function storedChain() {
	try { return localStorage.getItem("vl-fx") === "source" ? "source" : "program"; }
	catch (err) { return "program"; }
}

const socket = new WebSocket("ws://" + location.host + "/ws?token=" + encodeURIComponent(token));
const model = pageState.create(schema, socket, {
	setInterval: setInterval,
	clearInterval: clearInterval,
	now: function () { return performance.now(); },
}, {
	tap: storedTap(),
	fxChain: storedChain(),
});
const state = model.state;

function h(tag, props, ...kids) {
	const parts = tag.split(".");
	const el = document.createElement(parts[0] || "div");
	if (parts.length > 1) el.className = parts.slice(1).join(" ");

			el.setAttribute(key, value === true ? "" : value);

	for (const kid of kids.flat()) {

function paintFill(fill, value, min, max, mode) {
	const span = max - min || 1;
	const f = Math.min(1, Math.max(0, (Number(value) - min) / span));
	if (mode === "v") fill.style.height = f * 100 + "%";
	else if (mode === "bip") {
		fill.style.left = Math.min(f, 0.5) * 100 + "%";
		fill.style.width = Math.abs(f - 0.5) * 100 + "%";
	} else fill.style.width = f * 100 + "%";
}

const DRAW_W = 1280;
const DRAW_H = 720;
const drawColors = ["#ffffff", "#000000", "#ff5b4f", "#f2c14e", "#93d46d", "#6b8cf2"];
let drawTool = "pen";
let drawColor = drawColors[0];
let drawSize = 14;
let drawGround = "transparent";
let drawLive = false;
let drawGen = 0;
let drawWait = 0;
let drawPid = null;
let drawX = 0;
let drawY = 0;
const ink = h("canvas", { width: String(DRAW_W), height: String(DRAW_H) });
const flat = h("canvas", { width: String(DRAW_W), height: String(DRAW_H) });
const drawStage = h("div.dstage", null, ink);
const drawHint = h("span.hint");
const toolSeg = makeSeg(

const sizeSeg = makeSeg(

	(value) => { drawSize = value; paintDrawTools(); });
const groundSeg = makeSeg(
	[{ value: "transparent", label: "Transparent" }, { value: "black", label: "Black" }],
	(value) => { drawGround = value; paintDrawTools(); flushDraw(); });
const swatchButtons = drawColors.map((hex) => {
	const button = h("button.swatch", { type: "button" });
	button.style.background = hex;
	button.dataset.color = hex;
	button.addEventListener("click", () => {
		drawColor = hex;
		drawTool = "pen";
		paintDrawTools();
	});
	return button;
});
const clearBtn = h("button.btn", { type: "button" }, "Clear");
clearBtn.addEventListener("click", () => {
	ink.getContext("2d").clearRect(0, 0, DRAW_W, DRAW_H);
	flushDraw();
});
const videoFoot = h("div.vfoot", null, pagePrev, pageLabel, pageNext, h("div.sp"),
	h("span.hint", null, "Video"), videoPrev, videoNext);
const drawView = h("div.draw", { hidden: true },
	drawStage,
	h("div.dtools", null, toolSeg.el, h("div.swatches", null, swatchButtons), sizeSeg.el, groundSeg.el, drawHint, h("div.sp"), clearBtn));

function brushWidth() {
	const rect = ink.getBoundingClientRect();
	if (!(rect.width > 0)) return drawSize;
	return drawSize * (DRAW_W / rect.width);
}

function prepDraw(ctx) {
	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	ctx.lineWidth = brushWidth();
	if (drawTool === "eraser") {
		ctx.globalCompositeOperation = "destination-out";
		ctx.strokeStyle = "#000";
		ctx.fillStyle = "#000";
	} else {
		ctx.globalCompositeOperation = "source-over";
		ctx.strokeStyle = drawColor;
		ctx.fillStyle = drawColor;
	}
}

function drawDot(x, y) {
	const ctx = ink.getContext("2d");
	prepDraw(ctx);
	ctx.beginPath();
	ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
	ctx.fill();
}

function drawSegment(x, y) {
	const ctx = ink.getContext("2d");
	prepDraw(ctx);
	ctx.beginPath();
	ctx.moveTo(drawX, drawY);
	ctx.lineTo(x, y);
	ctx.stroke();
	drawX = x;
	drawY = y;
}

function drawPoint(event) {
	const rect = ink.getBoundingClientRect();
	const x = rect.width > 0 ? ((event.clientX - rect.left) / rect.width) * DRAW_W : 0;
	const y = rect.height > 0 ? ((event.clientY - rect.top) / rect.height) * DRAW_H : 0;
	return {
		x: Math.min(DRAW_W, Math.max(0, x)),
		y: Math.min(DRAW_H, Math.max(0, y)),
	};
}

function sendDraw() {
	if (Number(state.local.source_kind) !== 4) return;
	if (!openSocket()) {
		drawLive = false;
		return;
	}
	const gen = ++drawGen;
	const ctx = flat.getContext("2d");
	ctx.clearRect(0, 0, DRAW_W, DRAW_H);
	if (drawGround === "black") {
		ctx.globalCompositeOperation = "source-over";
		ctx.fillStyle = "#000";
		ctx.fillRect(0, 0, DRAW_W, DRAW_H);
	}
	ctx.drawImage(ink, 0, 0);
	flat.toBlob((blob) => {
		if (!blob || gen !== drawGen || !openSocket() || Number(state.local.source_kind) !== 4) return;
		socket.send(blob);
	}, "image/png");
}

function pokeDraw() {
	if (drawWait) return;
	drawWait = setTimeout(() => {
		drawWait = 0;
		sendDraw();
	}, 80);
}

function flushDraw() {
	if (drawWait) {
		clearTimeout(drawWait);
		drawWait = 0;
	}
	sendDraw();
}

function paintDrawTools() {
	paintChoice(toolSeg, drawTool);
	paintChoice(sizeSeg, String(drawSize));
	paintChoice(groundSeg, drawGround);
	for (const button of swatchButtons) button.classList.toggle("on", drawTool === "pen" && button.dataset.color === drawColor);
	drawView.classList.toggle("black", drawGround === "black");
	drawHint.textContent = drawGround === "black" ? "covers the Loop" : "strokes only";
}

function fitDrawCanvas() {
	if (drawView.hidden) return;
	const bw = drawStage.clientWidth;
	const bh = drawStage.clientHeight;
	if (!bw || !bh) return;
	const scale = Math.min(bw / DRAW_W, bh / DRAW_H);
	ink.style.width = Math.max(1, Math.round(DRAW_W * scale)) + "px";
	ink.style.height = Math.max(1, Math.round(DRAW_H * scale)) + "px";
}

function paintDraw() {
	const on = Number(state.local.source_kind) === 4;
	drawView.hidden = !on;
	folderRow.hidden = on;
	grid.hidden = on;
	videoFoot.hidden = on;
	tapSeg.el.hidden = on;
	paintDrawTools();
	fitDrawCanvas();
	if (on && !drawLive) {
		drawLive = true;
		sendDraw();
		requestAnimationFrame(fitDrawCanvas);
	}
	if (!on) drawLive = false;
}

ink.addEventListener("pointerdown", (event) => {
	if (drawPid != null) return;
	drawPid = event.pointerId;
	capture(ink, event);
	const point = drawPoint(event);
	drawX = point.x;
	drawY = point.y;
	drawDot(point.x, point.y);
	pokeDraw();
});
ink.addEventListener("pointermove", (event) => {
	if (event.pointerId !== drawPid) return;
	const point = drawPoint(event);
	drawSegment(point.x, point.y);
	pokeDraw();
});
const drawUp = (event) => {
	if (event.pointerId !== drawPid) return;
	drawPid = null;
	flushDraw();
};
ink.addEventListener("pointerup", drawUp);
ink.addEventListener("pointercancel", drawUp);
paintDrawTools();

const main = h("main", null,
	h("div.pcol", null, h("div.odub", null, overdub, erase), latchBtn, cuePad, cueVastBtn, panicBtn),
	h("div.col", null,
		h("div.panel.videos", null,
			h("div.ph", null, kindSeg.el, h("div.sp"), tapSeg.el),
			folderRow, grid, videoFoot, drawView),
		h("div.panel.blend", null,
			h("div.ph", null, h("span.pt", null, "Blend"), blendLabel, h("div.sp"),
				h("div.fams", null, famSwatch("fl", "licht"), famSwatch("fd", "donker"), famSwatch("fc", "contrast"), famSwatch("fx", "verschil")),
				h("span.hint", null, "· tik of veeg")),
			blendGrid),
		loopPanel,
		midError),
	h("div.col.rcol", null,
		h("div.panel.xf", null,
			h("div.ph", null, h("span.pt", null, "Transform"), h("span.hint.clip", { title: "Sleep of één vinger schuift. Knijpen schaalt en draait, ook op een trackpad. Alt-sleep schaalt. Shift-sleep of de rechterknop draait." }, "sleep schuift · knijp schaalt en draait"), h("div.sp"), aspectTog.el, barsTog.el),
			pad,
			h("div.xfread", null, h("span", null, "X", readX), h("span", null, "Y", readY), h("span", null, "Schaal", readS), h("span", null, "Draai", readR), h("div.sp"), resetBtn)),
		fxPanel),
	setupOverlay, mixOverlay);
stage.append(status, main);

function fit() {
	const vp = document.getElementById("viewport");
	const w = 1366, hgt = 950;
	const k = Math.min(vp.clientWidth / w, vp.clientHeight / hgt);
	if (!Number.isFinite(k) || k <= 0) return;
	stage.style.transform = "scale(" + k + ")";
	document.getElementById("holder").style.width = (w * k) + "px";
	document.getElementById("holder").style.height = (hgt * k) + "px";
	fitDrawCanvas();
}

socket.onopen = () => { model.linkUp(); paint(); };
socket.onclose = () => {
	model.linkLost();
	points.clear();
	pinchOrigin = null;
	clearTimeout(pinchTimer);
	pad.classList.remove("touch", "rot", "scale");
	paint();
};
socket.onmessage = (event) => {
	let msg;
	try { msg = JSON.parse(event.data); } catch (err) { return; }
	if (!msg || typeof msg !== "object") return;
	if (msg.t === "snapshot") model.frame(msg);
	else if (msg.t === "reject") model.reject(msg);
	else return;
	paint();
};

document.addEventListener("contextmenu", (event) => {
	if (event.target.closest("img")) event.preventDefault();
});
window.addEventListener("wheel", (event) => {
	if (event.ctrlKey) event.preventDefault();
}, { capture: true, passive: false });
document.addEventListener("dblclick", (event) => event.preventDefault());
let lastTapEnd = 0;
document.addEventListener("touchend", (event) => {
	const now = performance.now();
	if (now - lastTapEnd < 300) event.preventDefault();
	lastTapEnd = now;
}, { passive: false });
window.addEventListener("resize", fit);
const ro = new ResizeObserver(() => { measureGrid(); layoutFrame(); drawAdsr(); });
ro.observe(grid);
ro.observe(pad);
ro.observe(envBox);
fit();
paint();
measureGrid();
requestAnimationFrame(function tick() {
	if (state.exportOn) exportText.textContent = clock(performance.now() - state.exportBase);
	requestAnimationFrame(tick);
});
</script>
