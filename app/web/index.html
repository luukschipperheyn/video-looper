<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video Looper</title>
<style>
	body { margin: 0; padding: 24px; background: #111; color: #eee; font: 18px -apple-system, sans-serif; }
	#connection { font-weight: 600; }
	#export-state { font-weight: 600; }
	#export-state.running { color: #f44; }
	#export-reason { color: #fa0; }
	section { margin-top: 20px; }
	h2 { margin: 0 0 4px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
	label { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
	label > span { flex: 0 0 9em; }
	label > output { flex: 0 0 4em; text-align: right; font-variant-numeric: tabular-nums; }
	input[type=range] { flex: 1; height: 32px; }
	input[type=checkbox] { width: 32px; height: 32px; margin: 0; }
	select { font-size: 18px; padding: 4px 8px; }
</style>
</head>
<body>
<p>iPad page: <span id="connection">connecting</span></p>
<p>Export: <span id="export-state">stopped</span> <span id="export-reason"></span></p>
<div id="controls"></div>
<script>
	const schema = /*CONTROL_SCHEMA*/null;
	const sections = [
		["Overdub", [
			["arm_record", "Latch"],
			["cue_active", "Cue"],
			["record_blend_mode", "Blend", ["Mix", "Add", "Multiply", "Screen", "Overlay", "Difference", "Lighten",
				"Darken", "Hard Light", "Soft Light", "Color Dodge", "Color Burn"]],
			["record_blend_opacity", "Opacity"],
			["gain_mix", "Blend gain"],
		]],
		["Envelope", [
			["env_enabled", "Envelope"],
			["env_attack", "Attack (s)"],
			["env_decay", "Decay (s)"],
			["env_sustain", "Sustain"],
			["env_release", "Release (s)"],
		]],
		["FX", [
			["fx_enabled", "FX"],
			["fx_commit", "Bake FX"],
			["fx_mode", "FX mode", ["Feedback", "Difference", "Chromatic", "Kaleido", "Blur"]],
			["fx_param1", "Param 1"],
			["fx_param2", "Param 2"],
			["fx_param3", "Param 3"],
		]],
		["Source", [
			["source_kind", "Source", ["Shader", "Video", "Black", "Webcam"]],
			["webcam_index", "Webcam"],
			["file_loop", "Video loop"],
			["file_paused", "Video paused"],
			["file_run_mode", "Video run mode", ["Free", "Trigger"]],
			["file_loop_start", "Loop start"],
			["file_loop_length", "Loop length"],
		]],
		["Tempo", [
			["bpm", "BPM"],
			["read_speed_mult", "Read speed"],
			["tempo_coupled", "Tempo coupled"],
		]],
		["Export", [
			["record_enabled", "Export"],
			["record_fps", "Export fps"],
		]],
	];

	const token = new URLSearchParams(location.search).get("token") || "";
	const connection = document.getElementById("connection");
	const exportState = document.getElementById("export-state");
	const exportReason = document.getElementById("export-reason");
	const controls = {};
	const state = {};
	const socket = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);

	const busy = (el) => el.dataset.down === "1" || (el.tagName === "SELECT" && document.activeElement === el);
	const format = (v) => String(Number(v.toFixed(3)));

	function show(name) {
		const { el, out, type } = controls[name];
		if (!(name in state)) return;
		if (type === "bool") el.checked = state[name];
		else el.value = state[name];
		if (out) out.textContent = format(state[name]);
	}

	function sendSet(name) {
		const { el, out, type } = controls[name];
		const value = type === "bool" ? el.checked : type === "int" ? parseInt(el.value, 10) : parseFloat(el.value);
		if (out) out.textContent = format(value);
		if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ t: "set", name, value }));
	}

	function build(name, label, options) {
		const { type, min, max } = schema[name];
		const row = document.createElement("label");
		row.appendChild(document.createElement("span")).textContent = label;
		let el, out;
		if (type === "bool") {
			el = document.createElement("input");
			el.type = "checkbox";
		} else if (type === "int") {
			el = document.createElement("select");
			for (let i = min; i <= max; ++i) el.add(new Option(options ? options[i] : String(i), i));
		} else {
			el = document.createElement("input");
			el.type = "range";
			el.min = min;
			el.max = max;
			el.step = (max - min) / 1000;
			out = document.createElement("output");
		}
		row.appendChild(el);
		if (out) row.appendChild(out);
		controls[name] = { el, out, type };
		el.addEventListener("pointerdown", () => { el.dataset.down = "1"; });
		el.addEventListener("input", () => { if (type === "float") sendSet(name); });
		el.addEventListener("change", () => {
			if (type !== "float") sendSet(name);
			if (type === "int") el.blur();
		});
		return row;
	}

	const root = document.getElementById("controls");
	for (const [title, rows] of sections) {
		const section = root.appendChild(document.createElement("section"));
		section.appendChild(document.createElement("h2")).textContent = title;
		for (const [name, label, options] of rows) section.appendChild(build(name, label, options));
	}

	function release() {
		for (const name in controls) {
			const { el, type } = controls[name];
			if (el.dataset.down !== "1") continue;
			delete el.dataset.down;
			if (type !== "int") show(name);
		}
	}
	window.addEventListener("pointerup", release);
	window.addEventListener("pointercancel", release);

	socket.onopen = () => { connection.textContent = "connected"; };
	socket.onclose = () => { connection.textContent = "disconnected"; };
	socket.onmessage = (event) => {
		const msg = JSON.parse(event.data);
		if (msg.t === "snapshot") {
			Object.assign(state, msg);
			for (const name in controls) if (!busy(controls[name].el)) show(name);
			exportState.textContent = state.record_enabled ? "running" : "stopped";
			exportState.className = state.record_enabled ? "running" : "";
			if (state.record_enabled) exportReason.textContent = "";
		} else if (msg.t === "reject") {
			if (controls[msg.name]) show(msg.name);
			if (msg.name === "record_enabled") exportReason.textContent = msg.reason;
		}
	};
</script>
</body>
</html>
