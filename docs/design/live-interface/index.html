<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video Looper · ontwerpvoorstel</title>
<style>
:root{--bg:#0d0f10;--panel:#15181a;--panel2:#1c2023;--line:#252a2e;--line2:#333a3f;--text:#e7e9eb;--dim:#8b9297;--faint:#5c646a;
	--rec:#ff5b4f;--cue:#45d3c8;--amber:#f3a93c;--amberd:#33250f;--ok:#93d46d;
	--fl:#f2c46b;--fd:#6b8cf2;--fc:#c77df2;--fx:#6bf2a8;--fn:#9aa3a9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050606;color:var(--text);overflow:hidden;
	font:14px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;
	-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#chrome{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:12px;color:var(--dim)}
#chrome b{color:var(--text);font-weight:600}
#chrome .seg button{height:26px;font-size:12px}
#chrome label{display:flex;align-items:center;gap:6px}
#desc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:inline-block;width:22px;height:12px;border:1px dashed #66717a;border-radius:3px;vertical-align:-2px}
body.kaal #chrome{display:none}
#viewport{position:absolute;top:36px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
body.kaal #viewport{top:0}
#holder{position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:16px;display:grid}

/* generic */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:8px;min-height:24px}
.pt{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pv{font-size:13px;font-weight:600}
.hint{font-size:11px;color:var(--faint)}
.pt{white-space:nowrap}
.clip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folders .fchip{flex:1;justify-content:center;min-width:0}
.sp{flex:1}
.row{display:flex;align-items:center;gap:6px}
.btn{height:40px;padding:0 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;position:relative;overflow:hidden}
.btn:active{background:#2a3034}
.btn.sq{width:40px;padding:0;font-size:18px}
.new{border-style:dashed!important;border-color:#66717a!important}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;min-width:0}
.seg button{flex:1;height:34px;border-radius:6px;font-size:13px;color:var(--dim);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--text);color:#111;font-weight:650}
.tog{height:34px;padding:0 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.tog .led{width:8px;height:8px;border-radius:50%;background:#3a4045;flex:none}
.tog .st{color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tog.on{border-color:#4d6a3e}
.tog.on .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tog.on .st{color:var(--ok)}
.tog.amber.on{border-color:var(--amber);background:var(--amberd)}
.tog.amber.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tog.amber.on .st{color:var(--amber)}
.dimmed>*:not(.ph){opacity:.45}

/* fader */
.fader{display:flex;flex-direction:column;gap:5px;min-width:0;min-height:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--dim)}
.fv{color:var(--text);font-variant-numeric:tabular-nums;font-weight:650}
.ft{position:relative;height:40px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);overflow:hidden;touch-action:none;flex:none}
.ff{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#26302a,#93d46d40);border-right:2px solid var(--ok)}
.fader.bip .ff{border-right:0;background:#93d46d40}
.fader.bip .ft::after{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:#ffffff30}
.fader.inline .fh{position:absolute;inset:0;align-items:center;padding:0 10px;pointer-events:none;z-index:1}
.fader.inline .fh .fl{color:#c9ced2}
.ticks{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#ffffff14 calc(10% - 1px) 10%)}
.fader.off{opacity:.35;pointer-events:none}
.fader.v{height:100%}
.fader.v .fh{flex-direction:column;align-items:center;gap:2px}
.fader.v .ft{flex:1;height:auto}
.fader.v .ff{top:auto;right:0;bottom:0;border-right:0;border-top:2px solid var(--ok);background:linear-gradient(0deg,#26302a,#93d46d40)}
.fader.v .ticks{background:repeating-linear-gradient(0deg,transparent 0 calc(10% - 1px),#ffffff14 calc(10% - 1px) 10%)}
.fader.big .fv{font-size:20px}
.fader.big .fh{font-size:13px}

/* status */
.status{display:flex;align-items:center;gap:14px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:#101314;font-size:12px;min-width:0}
.conn{display:flex;align-items:center;gap:6px;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.lost{color:var(--amber)} .conn.lost .dot{background:var(--amber)}
.meter{display:flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
.bar{position:relative;height:8px;border-radius:4px;background:#22272b;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.lbar{width:180px} .lbar i{background:#45d3c840;border-right:2px solid var(--cue)}
.ebar{width:60px} .ebar i{background:var(--rec)}
.est{width:50px;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:4px}
.chip{height:22px;padding:0 7px;white-space:nowrap;border-radius:5px;font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;border:1px solid var(--line2);color:var(--faint)}
.chip.on.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.chip.on.cue{background:var(--cue);border-color:var(--cue);color:#032}
.chip.on.fx{background:#2c3a26;border-color:#4d6a3e;color:var(--ok)}
.chip.on.bake{background:var(--amber);border-color:var(--amber);color:#211}
.nowv{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.nowv b{color:var(--cue);font-weight:600}
.status .btn{height:32px;font-size:12px;padding:0 10px}
.exp.on{border-color:var(--rec);color:#ffb3ad;background:#2b1210}
.exp .rd{width:8px;height:8px;border-radius:50%;background:#5a2a26}
.exp.on .rd{background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* pads */
.padrow{display:grid;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line);background:#101314;min-height:0}
.pad{position:relative;border-radius:12px;border:2px solid;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;touch-action:none;min-height:0}
.pad .fill{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none}
.pad .top{display:flex;justify-content:space-between;align-items:baseline;position:relative}
.pad .nm{font-size:22px;font-weight:650}
.pad .stg{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pad .sb{position:relative;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.pad.rec{border-color:#6b2a25;background:#1b1211}
.pad.rec .fill{background:linear-gradient(0deg,#ff5b4f70,#ff5b4f20)}
.pad.rec.open{border-color:var(--rec);background:#341411}
.pad.rec.open .sb,.pad.rec .stg{color:#ffd2ce}
.pad.cue{border-color:#1f5450;background:#0f1a19}
.pad.cue.open{border-color:var(--cue);background:#123a37}
.pad.cue.open .sb{color:#d2fffb}
.ptog{position:relative;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;min-height:0}
.ptog .led{width:12px;height:12px;border-radius:50%;background:#3a4045}
.ptog .pn{font-size:13px;font-weight:650;text-align:center}
.ptog .ps{font-size:10px;font-weight:750;letter-spacing:.07em;color:var(--faint);text-align:center;text-transform:uppercase}
.ptog.rec.on{border-color:var(--rec);background:#341411} .ptog.rec.on .led{background:var(--rec);box-shadow:0 0 8px var(--rec)} .ptog.rec.on .ps{color:#ffd2ce}
.ptog.cue.on{border-color:var(--cue);background:#123a37} .ptog.cue.on .led{background:var(--cue);box-shadow:0 0 8px var(--cue)} .ptog.cue.on .ps{color:#d2fffb}
.panic{border:2px solid #7a2a24;color:#ff8a80;border-radius:12px;background:#140c0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
.panic div:first-child{font-weight:800;letter-spacing:.14em;font-size:14px}
.panic .psub{font-size:10px;color:#b0625b;text-align:center;padding:0 4px}
.panic:active{background:#3a1512}
.unknown{border-color:#5a4a2a!important;background:var(--panel2)!important}
.unknown::after{content:'status onbekend';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
	background:repeating-linear-gradient(45deg,#000d 0 8px,#000a 8px 16px);color:var(--amber);font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;z-index:3}
.oppad{display:flex;flex-direction:column;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.oppad .fader{flex:1}
.oppad .ft{flex:1;height:auto}

/* videos */
.videos{flex:1}
.folders{display:flex;gap:4px;min-width:0;overflow:hidden}
.fchip{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fchip.on{border-color:var(--cue);color:var(--text)}
.fchip .fc{font-size:10px;color:var(--faint)}
.vgrid{position:relative;flex:1;min-height:0;display:grid;gap:6px;align-content:start;touch-action:none}
.vc{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.vc .th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;border:2px solid transparent;transition:transform .08s}
.vc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.vc .nm{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:13px}
.vc.cur .th{border-color:var(--cue)}
.vc.cur .nm{color:var(--cue);font-weight:600}
.vc .star{position:absolute;top:2px;right:4px;font-size:13px;color:var(--amber);text-shadow:0 0 3px #000}
.vc .now{display:none;position:absolute;left:3px;top:3px;font-size:9px;font-weight:800;background:var(--cue);color:#032;border-radius:3px;padding:1px 4px}
.vc.cur .now{display:block}
.vc.press .th{transform:scale(.94)}
.vgrid.inactive .vc{opacity:.4}
.vempty{grid-column:1/-1;padding:20px;color:var(--faint);font-size:12px;text-align:center}
.vover{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#0d0f10ee;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px;color:var(--dim);z-index:2;text-align:center;max-width:90%}
.vover b{color:var(--text)}
.vfoot{display:flex;align-items:center;gap:6px}
.plabel{font-size:12px;color:var(--dim);min-width:84px;text-align:center}
.vstep{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.holdb .hb{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--amber)}

/* trackpad */
.xf{flex:1}
.tpad{position:relative;flex:1;min-height:0;border-radius:8px;background-color:#0b0d0e;border:1px solid var(--line2);overflow:hidden;touch-action:none;
	background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:32px 32px;background-position:center}
.tpad.touch{border-color:#2d6f6a}
.lframe{position:absolute;overflow:hidden;box-shadow:0 0 0 1px #ffffff70}
.lframe.bars{background:#000}
.lframe .simg{position:absolute;transform-origin:50% 50%}
.lframe .simg img{display:block;width:100%;height:100%;opacity:.8}
.lframe.fillsrc .simg{inset:0!important;width:auto!important;height:auto!important;transform:none!important;background:repeating-linear-gradient(135deg,#2b3134 0 6px,#202528 6px 12px)}
.sout{position:absolute;border:1.5px solid var(--cue);transform-origin:50% 50%;pointer-events:none}
.sout span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.24em;color:var(--cue);text-shadow:0 0 4px #000}
.flabel{position:absolute;left:6px;top:4px;font-size:9px;letter-spacing:.18em;color:#ffffffa0;text-shadow:0 0 3px #000;z-index:1}
.xhair{position:absolute;pointer-events:none;background:#ffffff18}
.xfread{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim)}
.xfread b{color:var(--text);font-weight:650;margin-left:4px}
.xfread .btn{height:36px}
.tpnote{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--faint);pointer-events:none}

/* blend */
.bgrid{display:grid;gap:4px;touch-action:none}
.bb{height:40px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;position:relative;overflow:hidden;white-space:nowrap;padding:0 4px}
.bb::before{content:'';position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--fam)}
.bb.on{background:var(--text);color:#111;font-weight:700}
.fams{display:flex;gap:8px;font-size:10px;color:var(--faint)}
.fams i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}

/* loop range */
.lr{position:relative;height:44px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);touch-action:none;flex:none;
	background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#ffffff12 calc(10% - 1px) 10%)}
.lr .win{position:absolute;top:-1px;bottom:-1px;background:#45d3c82a;border-top:2px solid var(--cue);border-bottom:2px solid var(--cue);touch-action:none}
.lr .hd{position:absolute;top:-1px;bottom:-1px;width:14px;background:var(--cue);border-radius:4px;touch-action:none}
.lr .hd::before{content:'';position:absolute;top:-6px;bottom:-6px;left:-14px;right:-14px}
.lr .hd::after{content:'';position:absolute;left:5px;right:5px;top:14px;bottom:14px;border-left:1px solid #0337;border-right:1px solid #0337}
.lr .hd.s{left:-7px} .lr .hd.e{right:-7px}
.lr .lpos{position:absolute;top:0;bottom:0;width:2px;background:#fff8;pointer-events:none}

/* adsr */
.adsr{flex:1}
.envbox{position:relative;flex:1;min-height:90px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);touch-action:none;overflow:hidden}
.envbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ea{fill:#93d46d18}
.el{fill:none;stroke:var(--ok);stroke-width:2}
.eg{stroke:#ffffff10;stroke-width:1}
.ed{fill:var(--rec);stroke:#fff;stroke-width:1.5}
.eh .hit{fill:transparent}
.eh .vis{fill:#0f1214;stroke:var(--ok);stroke-width:2}
.eh text{fill:var(--dim);font-size:10px;font-weight:700}
.adsr.envoff .envbox{opacity:.35}
.envvals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--dim)}
.envvals b{color:var(--text);font-weight:650;margin-left:3px}

/* tempo */
.bpm{height:40px;min-width:78px;border-radius:8px;background:#0f1214;border:1px solid var(--line2);display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:7px;touch-action:none}
.bpm .bv{font-size:20px;font-weight:700}
.bpm .u{font-size:10px;color:var(--dim)}
.tempo .seg button{padding:0 4px}

/* overlays */
.overlay{position:absolute;z-index:20;top:10px;bottom:10px;right:var(--ovl-right,10px);left:var(--ovl-left,10px);background:#0d0f10f4;border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px #000a}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-content:start;overflow:auto}
.osec{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.osec p{margin:0;font-size:12px;color:var(--dim);line-height:1.4}
.drawer{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#222a2e;border:1px solid var(--line2);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* variant A: console */
.vA{grid-template-rows:44px 1fr 126px}
.vA main{position:relative;display:grid;grid-template-columns:416px 1fr 372px;gap:10px;padding:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.vA .padrow{grid-template-columns:1.35fr 92px 1.55fr 1fr 92px 124px}

/* variant B: twee handen */
.vB{grid-template-rows:44px 1fr;--ovl-left:296px;--ovl-right:540px}
.vB .drawer{grid-template-columns:1fr}
.vB main{position:relative;display:grid;grid-template-columns:196px 80px 1fr 520px;gap:10px;padding:10px;min-height:0}
.vB .pcol{display:grid;grid-template-rows:3fr 76px 2fr 76px 92px;gap:8px;min-height:0}
.vB .opcol{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px}

/* variant C: staand */
.vC{grid-template-rows:44px 1fr 132px;--ovl-left:10px}
.vC main{position:relative;display:grid;grid-template-columns:1fr 360px;grid-template-rows:340px auto 1fr;gap:10px;padding:10px;min-height:0}
.vC .status{gap:10px}
.vC .lbar{width:90px}
.vC .ebar{width:40px}
.vC .adsr{min-height:170px}
.vC .padrow{grid-template-columns:1.4fr 88px 1.1fr 88px 112px}
.vC .xf{grid-column:1/3}
.opt{gap:10px}
</style>
</head>
<body>
<div id="chrome">
	<b>Video Looper · ontwerpvoorstel</b>
	<div class="seg" id="variants"></div>
	<span id="desc"></span>
	<span><i class="legend"></i> = bestaat nog niet</span>
	<label><input type="checkbox" id="lost"> verbinding weg</label>
</div>
<div id="viewport"><div id="holder"><div id="stage"></div></div></div>
<script>
const THUMB = (n) => `http://192.168.1.76:8734/thumb?name=${encodeURIComponent(n)}`;

function drag(el, hd) {
	el.style.touchAction = "none";
	el.addEventListener("pointerdown", (e) => {
		if (hd.down && hd.down(e) === false) return;
		capture(el, e);
		const sx = e.clientX, sy = e.clientY;
		let moved = false;
		const mv = (ev) => {
			if (ev.pointerId !== e.pointerId) return;
			const dx = ev.clientX - sx, dy = ev.clientY - sy;
			if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
			if (hd.move) hd.move(ev, { dx, dy, moved });
		};
		const up = (ev) => {
			if (ev.pointerId !== e.pointerId) return;
			el.removeEventListener("pointermove", mv);
			el.removeEventListener("pointerup", up);
			el.removeEventListener("pointercancel", up);
			if (hd.up) hd.up(ev, { moved, dx: ev.clientX - sx, dy: ev.clientY - sy });
		};
		el.addEventListener("pointermove", mv);
		el.addEventListener("pointerup", up);
		el.addEventListener("pointercancel", up);
	});
}

	s = s.replace(/_/g, " ").replace(/\b(pixabay|pexels|videos)\b ?/g, "").replace(/\b(\w+ \w+) \1\b/g, "$1").replace(/\b(\w+) \1\b/g, "$1");

}

function fader(o) {

function holdBtn(label, ms, fn) {

	const stop = () => { cancelAnimationFrame(raf); bar.style.width = "0"; };
	el.addEventListener("pointerdown", (e) => {
		capture(el, e);
		const t0 = performance.now();
		const step = () => {
			const f = (performance.now() - t0) / ms;
			bar.style.width = Math.min(1, f) * 100 + "%";
			if (f >= 1) { stop(); fn(); return; }
			raf = requestAnimationFrame(step);
		};
		raf = requestAnimationFrame(step);
	});

	el.addEventListener("pointercancel", stop);
	return el;
}

/* ---------- ADSR ---------- */
function adsr() {

		const hit = s("circle", { r: 24, class: "hit" }), vis = s("circle", { r: 7, class: "vis" }), tx = s("text", { "text-anchor": "middle" });

	};

		const xa = p + tx(S.A), xd = xa + tx(S.D), xs = xd + sus, xr = xs + tx(S.R);

		const d = "M" + P.map((q) => q.join(",")).join(" L");
		line.setAttribute("d", d);
		area.setAttribute("d", d + " Z");
		hA.place(g.xa, g.top);
		hD.place(g.xd, g.ys);
		hR.place(g.xr, g.bot);
		grid.replaceChildren(...[0.25, 0.5, 0.75].map((f) => s("line", { class: "eg", x1: 0, x2: g.W, y1: g.top + f * (g.bot - g.top), y2: g.top + f * (g.bot - g.top) })));
	}
	const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
	live(() => {
		if (!S.stage) { dot.style.display = "none"; return; }
		const g = geom();
		const P = [[g.p, g.bot], [g.xa, g.top], [g.xd, g.ys], [g.xs, g.ys], [g.xr, g.bot]];
		let q;

		h("div.envvals", null, h("span", null, "A", vA), h("span", null, "D", vD), h("span", null, "S", vSu), h("span", null, "R", vR)),

	return h("div.panel.tempo", null,
		h("div.ph", null, h("span.pt", null, "Tempo"), h("span.hint", null, "sleep BPM omhoog/omlaag"), h("div.sp"), tog("Gekoppeld", "coupled")),
		h("div.row", null, h("button.btn.sq", { onclick: () => set({ bpm: clamp(S.bpm - 1, 40, 240) }) }, "−"), bpmBox(),
			h("button.btn.sq", { onclick: () => set({ bpm: clamp(S.bpm + 1, 40, 240) }) }, "+"), h("button.btn.new", { onclick: tapTempo }, "Tap"), h("div.sp")),
		h("div.row", null, h("span.hint", null, "Leessnelheid"), h("div.sp"), speedSeg()));
}

/* ---------- second layer ---------- */
function setupOverlay() {
	const sec = (title, ...kids) => h("div.osec", null, h("span.pt", null, title), ...kids);
	const el = h("div.overlay", null,
		h("div.ph", null, h("span.pt", null, "Setup"), h("span.hint", null, "tweede laag · de pads blijven bereikbaar"), h("div.sp"), h("button.btn", { onclick: () => set({ overlay: null }) }, "Sluit")),
		h("div.ogrid", null,
			sec("Export", h("p", null, "Export schrijft naar een .mov op de Mac. Het pad kies je daar."), h("div.row", null, h("span.hint", null, "fps"), seg([24, 25, 30, 50, 60].map((v) => [v, String(v)]), "exportFps"))),
			sec("Source-framing", h("p", null, "Ook als schakelaar boven het trackpad."), h("div.row", null, tog("Preserve aspect", "aspect"), tog("Black bars", "bars")),
				h("div.row", null, h("span.hint", null, "Webcam"), seg([0, 1, 2, 3].map((i) => [i, String(i)]), "webcam"))),
			sec("Loop-weergave", fader({ key: "gain", min: 0, max: 1, def: 1, label: "Blend gain", fmt: (v) => v.toFixed(2) })),
			sec("Folder list", h("p", null, FOLDERS.map((f, i) => (i ? " · " : "") + f.name).join(""), h("br"), "Volgorde en mappen beheer je op de Mac.")),
			sec("Ableton Link", h("p", null, "Link en peers staan alleen-lezen in de Web interface. Aanzetten gebeurt op de Mac."))));
	bind(() => { el.hidden = S.overlay !== "setup"; });
	return el;
}
function fxTempoDrawer() {
	const el = h("div.overlay", null,
		h("div.ph", null, h("span.pt", null, "FX en Tempo"), h("span.hint", null, "de pads, Opacity en het trackpad blijven bereikbaar"), h("div.sp"), h("button.btn", { onclick: () => set({ overlay: null }) }, "Sluit")),
		h("div.drawer", null, fxPanel(), tempoPanel()));
	bind(() => { el.hidden = S.overlay !== "fx"; });
	return el;
}
function fxTempoButton() {
	const t = h("span");
	const b = h("button.btn", { onclick: () => set({ overlay: S.overlay === "fx" ? null : "fx" }) }, t);
	bind(() => { t.textContent = `FX ${S.fxOn ? FX_MODES[S.fxMode] : "uit"} · ${S.bpm} BPM · ${S.speed}×`; });
	return b;
}

/* ---------- variants ---------- */
const VARIANTS = {
	A(st) {
		const P = padSet();
		st.append(statusBar(),
			h("main", null,
				h("div.col", null, videoBrowser({ cols: 4 })),
				h("div.col", null, trackpad(), blendGrid({ cols: 6 })),
				h("div.col", null, adsr(), loopRange(), fxPanel(), tempoPanel()),
				setupOverlay()),
			h("div.padrow", null, P.overdub, P.latch, h("div.oppad", null, opacityFader("h")), P.cue, P.cueVast, P.panic));
	},
	B(st) {
		const P = padSet();
		st.append(statusBar([fxTempoButton()]),
			h("main", null,
				h("div.pcol", null, P.overdub, P.latch, P.cue, P.cueVast, P.panic),
				h("div.opcol", null, opacityFader("v")),
				h("div.col", null, videoBrowser({ cols: 5 }), blendGrid({ cols: 6 }), loopRange()),
				h("div.col", null, trackpad(), h("div", { style: { height: "220px", display: "flex", flex: "none" } }, adsr())),
				setupOverlay(), fxTempoDrawer()));
	},
	C(st) {
		const P = padSet();
		st.append(statusBar(),
			h("main", null,
				trackpad(),
				blendGrid({ cols: 6 }),
				h("div.panel.opt", null, opacityFader("h"), h("div.row", null, bpmBox(), h("button.btn.new", { onclick: tapTempo }, "Tap"), h("div.sp"), speedSeg())),
				videoBrowser({ cols: 5 }),
				h("div.col", null, loopRange(), adsr(), fxPanel()),
				setupOverlay()),
			h("div.padrow", null, P.overdub, P.latch, P.cue, P.cueVast, P.panic));
	},
};

const holder = document.getElementById("holder");
stageEl = document.getElementById("stage");
function fit() {
	const [w, hgt] = SIZES[S.variant];
	const vp = document.getElementById("viewport");
	const k = Math.min(vp.clientWidth / w, vp.clientHeight / hgt);
	Object.assign(stageEl.style, { width: w + "px", height: hgt + "px", transform: `scale(${k})` });
	Object.assign(holder.style, { width: w * k + "px", height: hgt * k + "px" });
}
function build() {
	subs.clear();
	lives.clear();
	observers.splice(0).forEach((o) => o.disconnect());
	stageEl.replaceChildren();
	stageEl.className = "v" + S.variant;
	VARIANTS[S.variant](stageEl);
	chromeBind();
	fit();
}

const variants = document.getElementById("variants");
const names = { A: "A · Console", B: "B · Twee handen", C: "C · Staand" };
for (const v of Object.keys(VARIANTS)) {
	const b = h("button", { onclick: () => { S.overlay = null; S.variant = v; location.hash = v; build(); } }, names[v]);
	b._v = v;
	variants.append(b);
}
const lost = document.getElementById("lost");
lost.onchange = () => set({ connected: !lost.checked, gateHeld: false, cueHeld: false });
function chromeBind() {
	bind(() => {
		for (const b of variants.children) b.classList.toggle("on", b._v === S.variant);
		document.getElementById("desc").textContent = DESC[S.variant];
	});
}
if (new URLSearchParams(location.search).has("kaal")) document.body.classList.add("kaal");
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", fit);

function sim(dt) {
	const rate = 60 * (S.coupled ? S.bpm / 120 : 1) * S.speed;
	S.loop = (S.loop + dt * rate / 120) % 1;
	if (S.exporting) S.exportT += dt;
	const open = gateOpen();
	if (!S.envOn) { S.env = open ? 1 : 0; S.stage = open ? 3 : 0; return; }
	if (open) {
		if (S.stage === 0 || S.stage === 4) S.stage = 1;
		if (S.stage === 1) { S.env += dt / Math.max(S.A, 0.001); if (S.env >= 1) { S.env = 1; S.stage = 2; } }
		else if (S.stage === 2) { S.env -= dt / Math.max(S.D, 0.001) * (1 - S.Su); if (S.env <= S.Su) { S.env = S.Su; S.stage = 3; } }
		else S.env = S.Su;
	} else if (S.stage) {
		if (S.stage !== 4) { S.stage = 4; S.relFrom = S.env; }
		S.env -= dt / Math.max(S.R, 0.001) * S.relFrom;
		if (S.env <= 0) { S.env = 0; S.stage = 0; }
	}
}
let last = performance.now();
function tick(now) {
	sim(Math.min(0.05, (now - last) / 1000));
	last = now;
	for (const f of lives) f();
	requestAnimationFrame(tick);
}
build();
requestAnimationFrame(tick);
</script>
